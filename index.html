    <title>Alex Arcano | Fragmentos de Memoria</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           VARIABLES Y CONFIGURACIÓN BASE
           ========================================== */
        :root {
            --color-bg: #FCFCFC;
            --color-text: #FFFFFF;
            --color-muted: rgba(255,255,255,0.78);
            --color-accent: rgba(255,255,255,0.92);    
            
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            
            --spacing-section: 15vh;
            --spacing-element: 2rem;
        }

        html {
            scroll-behavior: smooth;
            background-color: #000000; 
        }

        body {
            background-color: transparent; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body::before {
            color: #FFFFFF;
            font-family: var(--font-sans);
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;

            background:
                linear-gradient(
                    rgba(0,0,0,0.65),
                    rgba(0,0,0,0.65)
                ),
                url('images/fondo.webp') center center / cover no-repeat;

            opacity: 1;
            z-index: -1;
        }
        
        /* ==========================================
           TIPOGRAFÍA Y EDITORIAL (PC)
           ========================================== */ 
        h1, h2, h3, h4, .serif {
            font-family: var(--font-serif);
            font-weight: 500;
        }

        .hero-title, .song-title-large, .note-title, .about-title {
            color: #FFFFFF !important; /* Forzar legibilidad blanca */
            text-shadow: 0 8px 30px rgba(0,0,0,0.65);
        }

        a {
            color: var(--color-text);
            text-decoration: none;
            transition: color 0.4s ease;
        }

        a:hover {
            color: var(--color-accent);
        }

        .btn-link {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.25);
            padding-bottom: 3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-link:hover {
            color: var(--color-accent);
            border-color: var(--color-accent);
        }

        /* ==========================================
           ANIMACIONES DE SCROLL (REVEAL)
           ========================================== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================
           NAVEGACIÓN (PC)
           ========================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            padding: 0 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.65) 0%,
                rgba(0,0,0,0.35) 70%,
                rgba(0,0,0,0) 100%
            );
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            transition: padding 0.5s ease;
        }

        header.scrolled {
            height: 55px;
            padding: 0 4rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .logo{
            cursor:pointer;
            display:flex;
            align-items:center;
            margin-left: -20px;
        }

        .logo img{
            height:22px;
            width:auto;
            display:block;
        }

        nav ul {
            display: flex;
            gap: 3.5rem;
            list-style: none;
        }

        nav a {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--color-text);
            transition: width 0.3s ease;
        }

        nav a.active { color: #FFFFFF; }
        nav a.active::after { width: 100%; }
        nav a:hover {
            color: #FFFFFF;
        }

        .menu-toggle {
            display: none;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #FFFFFF !important;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        /* ==========================================
           ESTRUCTURA SPA
           ========================================== */
        main {
            padding-top: 22vh;
            min-height: 100vh;
            max-width: 1700px;
            margin: 0 auto;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .view {
            display: none;
            opacity: 0;
            animation: fadeInView 1.2s forwards ease-out;
        }

        .view.active { display: block; }

        @keyframes fadeInView {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           INICIO (PC)
           ========================================== */
        #inicio {
            text-align: center;
            padding-bottom: var(--spacing-section);
        }

        .hero-title {
            color: #FFFFFF;
            text-shadow: 0 10px 40px rgba(0,0,0,0.60);
            font-size: 4.8rem;
            margin-top: -30px; 
            margin-bottom: 0.8rem;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.15rem;
            color: rgba(255,255,255,0.75);
            letter-spacing: 0.04em; 
            margin-bottom: 1.8rem; 
            font-weight: 300;
            line-height: 1.8;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-featured {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .featured-label {
            font-family: var(--font-serif);
            font-size: 2.4rem;
            font-style: italic;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.02em;
            margin-bottom: 1.5rem;
            text-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        .cover-placeholder {
            width: 100%;
            background-color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A0A0A0;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 4px;
            overflow: hidden;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-featured .cover-placeholder {
            max-width: 500px;
            aspect-ratio: 1/1;
            margin-bottom: 3rem;
            cursor: pointer;
        }

        .hero-featured .cover-placeholder:hover {
            transform: scale(1.02);
        }

        .featured-title {
            font-size: 3rem;
            margin-bottom: 3rem;
            color: #FFFFFF;
            text-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .media-embeds {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 3rem auto;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* Redes Sociales del Inicio */
        .social-icons {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.10);
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icons a img {
            width: 30px;
            height: 30px;
            opacity: 0.8;
            transition: all 0.3s ease;
            filter: brightness(0) invert(1);
        }

        .social-icons a img:hover {
            transform: scale(1.25);
            opacity: 1;
        }

        /* ==========================================
           MÚSICA (GALERÍA)
           ========================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 240px);
            justify-content: center;
            gap: 4rem 3rem;
            padding-bottom: var(--spacing-section);
        }

        .song-card {
            cursor: pointer;
            text-align: center;
            position: relative;
        }

        .song-card-img-wrapper {
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            background-color: #121212;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge-upcoming {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-family: var(--font-sans);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #000000;
            background: rgba(255, 255, 255, 0.95);
            padding: 0.4rem 1.2rem;
            backdrop-filter: blur(5px);
            z-index: 10;
            font-weight: 500;
            border-radius: 2px;
        }

        .song-card .cover-image { 
            height: 100%; 
            transition: transform 0.6s ease; 
        }
        
        .song-card:hover .cover-image {
            transform: scale(1.03);
        }

        /* OVERLAY SOBRE IMAGEN */
        .song-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.35),
                rgba(0,0,0,0.75)
            );
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .song-card:hover .song-overlay {
            opacity: 1;
        }

        .song-card-title {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 0.3rem;
            text-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .song-card-year {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.75);
        }

        /* ==========================================
           PLANTILLA DE CANCIÓN INDIVIDUAL
           ========================================== */
        .song-template-wrapper {
            max-width: 950px;
            margin: 0 auto;
            padding-bottom: var(--spacing-section);
        }

        .back-link{
            display:block;
            width:fit-content;
            margin:0 auto 50px;
            font-size:.8rem;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:rgba(255,255,255,.75);
            cursor:pointer;
            transition:.3s;
        }

        .back-link:hover{
            color:#fff;
        }

        /* Estructura asimétrica de dos columnas para detalles */
        .song-detail-layout {
            display: flex;
            gap: 3.5rem;
            align-items: flex-start;
            margin-bottom: 4rem;
            text-align: left;
        }

        .song-detail-left {
            flex: 0 0 240px;
        }

        .song-detail-left .cover-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            transition: transform 0.5s ease;
        }
        .song-detail-left .cover-placeholder:hover {
            transform: scale(1.02);
        }

        .song-detail-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .song-detail-right .song-title-large {
            color: #FFFFFF !important;
            text-shadow: 0 8px 30px rgba(0,0,0,0.50);
            font-size: 3.2rem;
            margin-bottom: 0.2rem;
            line-height: 1.1;
            text-align: left;
            letter-spacing: -0.02em;
        }

        .song-detail-right .song-story {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.92);
            text-align: left;
            font-style: italic;
            margin: 0;
            border-left: 2px solid rgba(255,255,255,0.15);
            padding-left: 1.5rem;
        }

        /* Contenedor del video integrado en la derecha */
        .song-detail-right #detail-video-container {
            width: 100%;
            max-width: 500px;
            margin: 1rem 0 0 0;
        }

        .song-actions {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 4rem 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 2.5rem 0;
        }

        /* ==========================================
           SECCIÓN DE LETRA (SLIDE + FADE EMOCIONAL)
           ========================================== */
        .lyrics-wrapper {
            margin: 4rem auto;
            text-align: center;
            max-width: 600px;
        }

        .lyrics-toggle-btn {
            background: none;
            border: none;
            color: var(--color-muted);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 10px 0;
            position: relative;
            transition: color 0.4s ease;
        }

        .lyrics-toggle-btn:hover {
            color: var(--color-text);
        }

        /* Línea sutil bajo el botón */
        .lyrics-toggle-btn::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 50%;
            background-color: var(--color-text);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translateX(-50%);
        }

        .lyrics-toggle-btn:hover::after {
            width: 100%;
        }

        /* Contenedor colapsable de líricas */
        .lyrics-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.9s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lyrics-content.abierto {
            max-height: 3500px;
            opacity: 1;
            margin-top: 4rem;
            background: rgba(0,0,0,0.35);
            padding: 2.5rem 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .lyrics-text {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            white-space: pre-line;
            text-align: center;
            letter-spacing: 0.02em;
            font-style: italic;
            font-weight: 500;
        }

        /* NOTIFICACIÓN TOAST PREMIUM */
        .custom-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: all .4s ease;
            background: rgba(0,0,0,0.85);
            padding: 12px 24px;
            border-radius: 8px;
            color: #fff;
            z-index: 9999;
            pointer-events: none;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .custom-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==========================================
           NOTAS (Notas al Margen)
           ========================================== */
        .notes-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .notes-subtitle{
            max-width: 650px;
            margin: 1.5rem auto 0;
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.75);
            font-weight: 300;
        }
        
        .notes-categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 2rem;
            margin-bottom:5rem;
        }
        
        .category-tag{
            display:flex;
            align-items:center;
            gap:8px;
            font-size:.75rem;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:var(--color-muted);
            border:1px solid rgba(255,255,255,.15);
            padding:.5rem 1.5rem;
            border-radius:50px;
            cursor:pointer;
            transition:.3s ease;
        }
        
        .category-tag:hover {
            border-color: var(--color-text);
            color: var(--color-text);
        }

        .notes-container {
            max-width: 700px;
            margin: 0 auto;
            padding-bottom: var(--spacing-section);
        }

        .note-entry {
            background: rgba(0,0,0,0.50);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .note-layout{
            display:flex;
            gap:50px;
            align-items:flex-start;
        }

        .note-content{
            flex:1;
        }

        .note-image{
            width:300px;
            flex-shrink:0;
        }

        .note-image img{
            width:100%;
            aspect-ratio:1/1;
            object-fit:cover;
            border-radius:8px;
            display:block;
            box-shadow:0 15px 40px rgba(0,0,0,.35);
        }

        .note-meta{
            display:flex;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:35px;
            position:relative;
        }

        .note-meta::after{
            content:"";
            position:absolute;
            left:0;
            bottom:-8px;
            width:80px;
            height:1px;
            background:rgba(255,255,255,.25);
        }

        .note-tag{
            font-size:.75rem;
            letter-spacing:.15em;
            text-transform:uppercase;
            color:rgba(255,255,255,.85);
            font-weight:500;
        }

        .note-separator{
            color:rgba(255,255,255,.35);
        }

        .note-date{
            margin:0;
            font-size:.75rem;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:rgba(255,255,255,.55);
        }

        /* PEGAR AQUÍ */
        .note-meta i{
            margin-right:8px;
            opacity:.8;
            font-size:.8rem;
        }

        .note-title {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            color: #fff;
        }

        .note-body {
            font-family: var(--font-sans);
            font-size: 1.15rem;
            line-height: 1.9;
            color: rgba(255,255,255,0.92);
        }
        /* ==========================================
           SOBRE ALEX ARCANO
           ========================================== */
        .about-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: var(--spacing-section);
            text-align: center;
        }
        
        .about-title {
            font-size: 4rem;
            margin-bottom: 4rem;
            color: #FFFFFF !important;
        }

        .about-photo{
            display:flex;
            justify-content:center;
            margin-bottom:4rem;
        }

        .about-photo img{
            width:100%;
            max-width:450px;
            aspect-ratio:3/4;
            object-fit:cover;
            border-radius:8px;
            box-shadow:0 20px 50px rgba(0,0,0,.45);
        }      
        
        .about-text{
            font-size:1.25rem;
            color:rgba(255,255,255,0.92);
            line-height:2;
            text-align:justify;
            text-align-last:center;
            background:rgba(0,0,0,0.35);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            padding:2rem;
            border-radius:12px;
        }
        
        .about-text p {
            margin-bottom: 2.5rem;
        }

        /* BOTÓN SUBIR */
        #scrollTopBtn{
            position:fixed;
            bottom:30px;
            right:30px;
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            color:white;
            cursor:pointer;
            font-size:22px;
            z-index:9999;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
            transition: background 0.3s ease;
        }
        #scrollTopBtn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* ATRÁS / ADELANTE (PC) */
        #historyNav{
            display: none !important; /* Desactivado por defecto, manejado por botones nativos */
        }

        .video-responsive {
            width: 100%;
            aspect-ratio: 16 / 10;
